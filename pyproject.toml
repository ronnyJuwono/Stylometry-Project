[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stylometry-research-platform"
version = "0.1.0"
description = "Experiment process dashboard for EFL writing stylometry research"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "streamlit>=1.40,<2",
  "plotly>=5.24,<7",
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
